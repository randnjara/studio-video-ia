# Construit l'image du serveur lip-sync (dossier worker-lipsync/ : InfiniteTalk sur Wan 2.1) et la publie sur GitHub
# Container Registry, dans le même dépôt d'images que le serveur vidéo, avec l'étiquette « lipsync » :
# ghcr.io/randnjara/studio-video-ia-worker:lipsync (et :lipsync-v<VERSION>, que le studio donne à RunPod)
name: Serveur lip-sync

on:
  push:
    branches: [main]
    paths: ["worker-lipsync/**", ".github/workflows/serveur-lipsync.yml"]
  # Dans une PR : l'image est construite (et vérifiée) sans être publiée
  pull_request:
    paths: ["worker-lipsync/**", ".github/workflows/serveur-lipsync.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # L'image de base PyTorch (version « devel », pour flash-attn) est grosse : on libère de la place
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Numéro de version lu par le studio, qui bascule le serveur lip-sync sur la nouvelle image
      - name: Version
        id: version
        run: echo "v=$(cat worker-lipsync/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-lipsync
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-worker:lipsync
            ghcr.io/${{ github.repository }}-worker:lipsync-${{ github.sha }}
            ghcr.io/${{ github.repository }}-worker:lipsync-v${{ steps.version.outputs.v }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
